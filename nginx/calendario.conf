# ──────────────────────────────────────────────────────────────────────────────
# Virtual host para TU nginx (el que ya gestiona tus dominios).
#   /etc/nginx/sites-available/calendario.conf  →  ln -s a sites-enabled/
#   (o /etc/nginx/conf.d/calendario.conf)
#
# Cambia calendario.tudominio.es por tu subdominio. Emite el certificado ANTES de
# activar este fichero (lo referencia y nginx -t fallaría sin él):
#   sudo certbot certonly --nginx -d calendario.tudominio.es
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name calendario.tudominio.es;

    # Apple abre webcal:// como http:// → lo mandamos a HTTPS.
    # (Si certbot gestiona este bloque, puede reescribirlo; da igual, hace lo mismo.)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx >= 1.25.1; en versiones anteriores: "listen 443 ssl http2;"
    server_name calendario.tudominio.es;

    ssl_certificate     /etc/letsencrypt/live/calendario.tudominio.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendario.tudominio.es/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # La URL lleva el token secreto: no la dejes en el access log
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8088;      # = WEB_BIND del stack
        proxy_http_version 1.1;
        proxy_set_header Host              $host;   # necesario para el enlace webcal://
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las cabeceras del feed (Content-Type, Cache-Control, ETag, 304...)
        # vienen del contenedor y nginx las deja pasar tal cual. No añadas aquí
        # "expires" ni "proxy_cache": congelarían el calendario.
        proxy_read_timeout 30s;
    }
}
