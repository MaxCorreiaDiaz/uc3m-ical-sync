# ──────────────────────────────────────────────────────────────────────────────
# Tests + build multi-arquitectura + publicación en GitHub Container Registry.
#
# Resultado:
#   ghcr.io/<usuario>/uc3m-ical-sync-worker:latest   (y :1.2.3, :1.2, :sha-abc1234)
#   ghcr.io/<usuario>/uc3m-ical-sync-web:latest
#
#   push a main   → :latest + :sha-xxxxxxx
#   tag v1.2.3    → :1.2.3 + :1.2
#   pull request  → solo tests y build (no publica)
#   lunes 03:17   → rebuild para recoger parches de las imágenes base
# ──────────────────────────────────────────────────────────────────────────────
name: Build & publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "nginx/**", "compose*.yaml", ".env.example"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r worker/requirements.txt pytest
          python -m playwright install --with-deps chromium

      - name: pytest (incluye e2e con Chromium contra SSO simulado)
        working-directory: worker
        env:
          REQUIRE_E2E: "1"   # en CI los e2e no pueden saltarse en silencio
        run: python -m pytest -q

  build:
    name: Imagen ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [worker, web]
    steps:
      - uses: actions/checkout@v7

      # La versión de la imagen base de Playwright se deriva de requirements.txt:
      # imposible que se desincronicen.
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(grep -Po '^playwright==\K[0-9.]+' worker/requirements.txt)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/uc3m-ical-sync-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=uc3m-ical-sync-${{ matrix.image }}
            org.opencontainers.image.description=Pasarela UC3M → feed iCalendar para Apple Calendar / iCloud

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            PLAYWRIGHT_VERSION=${{ steps.pw.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
