# ──────────────────────────────────────────────────────────────────────────────
# Tests + build multi-arquitectura + publicación en GitHub Container Registry.
#
# Resultado:
#   ghcr.io/<usuario>/uc3m-ical-sync-worker:latest   (y :1.2.3, :1.2, :sha-abc1234)
#   ghcr.io/<usuario>/uc3m-ical-sync-web:latest
#
#   push a main   → :latest + :sha-xxxxxxx
#   tag v1.2.3    → :1.2.3 + :1.2
#   pull request  → solo tests y build (no publica)
#   lunes 03:17   → rebuild para recoger parches de las imágenes base
# ──────────────────────────────────────────────────────────────────────────────
name: Build & publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "nginx/**", "compose*.yaml", ".env.example"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04   # fijo: --with-deps depende de la distro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # no dejar el token en .git/config

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r worker/requirements.txt pytest
          python -m playwright install --with-deps --only-shell chromium   # igual que la imagen

      - name: pytest (incluye e2e con Chromium contra SSO simulado)
        working-directory: worker
        env:
          REQUIRE_E2E: "1"   # en CI los e2e no pueden saltarse en silencio
        run: python -m pytest -q

  build:
    name: Imagen ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-24.04   # fijo: --with-deps depende de la distro
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # no dejar el token en .git/config

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/uc3m-ical-sync-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=uc3m-ical-sync-${{ matrix.image }}
            org.opencontainers.image.description=Pasarela UC3M → feed iCalendar para Apple Calendar / iCloud

      # Smoke test ANTES de publicar: la imagen tiene que arrancar con las mismas
      # restricciones que compose.yaml (sin capabilities, no-new-privileges,
      # sistema de ficheros de solo lectura en web).
      - name: Build local (amd64) para smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64
          load: true
          tags: smoke/${{ matrix.image }}:test
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Smoke test con cap_drop ALL
        env:
          IMAGE: smoke/${{ matrix.image }}:test
          KIND: ${{ matrix.image }}
        run: |
          set -euo pipefail
          HARDEN=(--cap-drop ALL --security-opt no-new-privileges:true)
          if [ "$KIND" = web ]; then
            docker run -d --name smoke "${HARDEN[@]}" --read-only \
              --tmpfs /tmp --tmpfs /data --tmpfs /config \
              -e FEED_TOKEN=0123456789abcdef0123456789abcdef -p 18080:8080 "$IMAGE"
            for _ in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/nada || true)
              [ "$code" = 404 ] && break
              sleep 1
            done
            docker logs smoke
            [ "$code" = 404 ] || { echo "Caddy no responde (HTTP $code)"; exit 1; }
            docker exec smoke wget -qO- http://127.0.0.1:8081/healthz
            docker rm -f smoke
          else
            docker run --rm "${HARDEN[@]}" --entrypoint python "$IMAGE" -c \
              "import sync_uc3m, playwright, icalendar, apscheduler; print('imports OK')"
            docker run --rm "${HARDEN[@]}" --shm-size 1g --entrypoint python "$IMAGE" -c \
              "from playwright.sync_api import sync_playwright as s
          with s() as p:
              b = p.chromium.launch(); pg = b.new_page(); pg.set_content('<p>ok</p>')
              print('Chromium OK', b.version, pg.inner_text('p')); b.close()"
            docker run --rm "${HARDEN[@]}" "$IMAGE" --healthcheck
            # UID 1001 (compatibilidad con volúmenes existentes) y volúmenes escribibles
            docker run --rm "${HARDEN[@]}" --entrypoint sh "$IMAGE" -c \
              'test "$(id -u):$(id -g)" = "1001:1001" && touch /data/.w /var/www/calendarios/.w && echo "uid/volúmenes OK"'
          fi
          SIZE=$(docker image inspect -f '{{.Size}}' "$IMAGE" | numfmt --to=iec)
          echo "### Tamaño de la imagen $KIND (amd64): $SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Imagen ${KIND}::${SIZE} (amd64, sin comprimir)"

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
